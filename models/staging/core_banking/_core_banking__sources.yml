version: 2

sources:
  - name: core_banking
    description: '{{ doc("core_banking") }}'
    schema: raw_core_banking
    meta:
      producer_team: core-banking-platform   # owns the source database
      ingestion_owner: data-platform         # owns the replication to the warehouse
    # Freshness is based on the load time that the ingestion step adds to every row.
    # Default: tables are loaded daily. Transactions override this (hourly).
    loaded_at_field: _loaded_at
    config:
      freshness:
        warn_after: {count: 26, period: hour}   # daily load is late
        error_after: {count: 48, period: hour}  # a full daily load was missed
    tables:
      - name: accounts
        description: '{{ doc("stg_core_banking__accounts") }}'
        columns:
          - name: account_id
            description: '{{ doc("stg_core_banking__accounts__account_id") }}'
            data_tests: [unique, not_null]
          - name: company_name
            description: '{{ doc("stg_core_banking__accounts__company_name") }}'
          - name: industry
            description: '{{ doc("stg_core_banking__accounts__industry") }}'
          - name: country
            description: '{{ doc("stg_core_banking__accounts__country_code") }}'
          - name: plan_type
            description: '{{ doc("stg_core_banking__accounts__plan_type") }}'
          - name: created_at
            description: '{{ doc("stg_core_banking__accounts__created_at") }}'
          - name: _loaded_at
            description: '{{ doc("_loaded_at") }}'

      - name: virtual_cards
        description: '{{ doc("stg_core_banking__virtual_cards") }}'
        columns:
          - name: card_id
            description: '{{ doc("stg_core_banking__virtual_cards__card_id") }}'
            data_tests: [unique, not_null]
          - name: account_id
            description: '{{ doc("stg_core_banking__accounts__account_id") }}'
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('core_banking', 'accounts')
                    field: account_id
          - name: card_name
            description: '{{ doc("stg_core_banking__virtual_cards__card_name") }}'
          - name: created_at
            description: '{{ doc("stg_core_banking__virtual_cards__created_at") }}'
          - name: status
            description: '{{ doc("stg_core_banking__virtual_cards__card_status") }}'
          - name: card_type
            description: '{{ doc("stg_core_banking__virtual_cards__card_type") }}'
          - name: _loaded_at
            description: '{{ doc("_loaded_at") }}'

      - name: transactions
        description: '{{ doc("stg_core_banking__transactions") }}'
        # Loaded hourly.
        config:
          freshness:
            warn_after: {count: 2, period: hour}   # hourly load is late
            error_after: {count: 3, period: hour}  # two hourly loads were missed
        columns:
          - name: transaction_id
            description: '{{ doc("stg_core_banking__transactions__transaction_id") }}'
            data_tests: [unique, not_null]
          - name: card_id
            description: '{{ doc("stg_core_banking__virtual_cards__card_id") }}'
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('core_banking', 'virtual_cards')
                    field: card_id
          - name: amount
            description: '{{ doc("stg_core_banking__transactions__amount") }}'
          - name: currency
            description: '{{ doc("stg_ecb__fx_rate__currency_code") }}'
          - name: merchant_category
            description: '{{ doc("stg_core_banking__transactions__merchant_category") }}'
          - name: transaction_date
            description: '{{ doc("stg_core_banking__transactions__transaction_at") }}'
          - name: _loaded_at
            description: '{{ doc("_loaded_at") }}'
