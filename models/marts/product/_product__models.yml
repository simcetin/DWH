version: 2

models:
  - name: mart_cards_daily
    description: '{{ doc("mart_cards_daily") }}'
    config:
      meta:
        certified: true
        pipeline_owner: [product-analytics, analytics-engineering]   # builds, runs and maintains the model
        logic_owner: product-team   # decides the business logic; align with this team before changes
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_day, industry, plan_type, country_code]
    columns:
      - name: date_day
        description: '{{ doc("dim_date__date_day") }}'
        data_tests: [not_null]
      - name: industry
        description: '{{ doc("stg_core_banking__accounts__industry") }}'
      - name: plan_type
        description: '{{ doc("stg_core_banking__accounts__plan_type") }}'
      - name: country_code
        description: '{{ doc("stg_core_banking__accounts__country_code") }}'
      - name: cards_created
        description: '{{ doc("mart_cards_daily__cards_created") }}'
        config:
          meta:
            business_owner: product-team   # owns the definition of cards created
        data_tests: [not_null]
      - name: cards_used
        description: '{{ doc("mart_cards_daily__cards_used") }}'
        config:
          meta:
            business_owner: product-team   # owns the definition of cards used
        data_tests: [not_null]
