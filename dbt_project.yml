name: dwh
version: "1.0.0"
config-version: 2

profile: dwh

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

# The seeds stand in for raw data that an ingestion tool would load in a real
# setup. Each folder is loaded into the raw schema of its source system, and the
# staging models read them with source(), not ref().
seeds:
  dwh:
    core_banking:
      +schema: raw_core_banking
      # Acts like an ingestion tool: after each load, stamp every row with the
      # load time (timestamptz, so freshness compares it correctly with now).
      # Source freshness checks use this column. See _core_banking__sources.yml.
      # full_refresh: recreate the table on every load, because the extra
      # _loaded_at column would not match the CSV on a reload.
      +full_refresh: true
      +post-hook:
        - "alter table {{ this }} add column if not exists _loaded_at timestamptz"
        - "update {{ this }} set _loaded_at = current_timestamp"
    ecb:
      +schema: raw_ecb

# History (SCD2) of source tables that are overwritten on every load.
# In dev they go to main_snapshots, in prod to snapshots.
snapshots:
  dwh:
    +schema: snapshots
    +meta:
      layer: snapshots
      owner: analytics-engineering
      contact: "#analytics-engineering"
    core_banking:
      +meta:
        source_system: core_banking
        data_domain: cards_and_payments

models:
  dwh:
    +materialized: view
    # Governance metadata shared by all models. dbt merges it with the meta set
    # on each layer and subfolder below and in each model's YAML.
    +meta:
      owner: analytics-engineering              # team that maintains the models
      contact: "#analytics-engineering"         # Slack channel for questions
    staging:
      +schema: staging
      +meta:
        layer: staging
      core_banking:
        +meta:
          source_system: core_banking
          data_domain: cards_and_payments
      ecb:
        +meta:
          source_system: ecb
          data_domain: reference_data
    # Business logic steps between staging and marts. Not for end users.
    intermediate:
      +schema: intermediate
      +materialized: view
      +meta:
        layer: intermediate
        data_domain: cards_and_payments
    # Dimensional model (dims and facts) and aggregated marts for the Product team.
    marts:
      +schema: marts
      +materialized: table
      +meta:
        layer: marts
      core:
        +meta:
          data_domain: cards_and_payments
      product:
        +meta:
          data_domain: product_analytics
          consumers: product-team
