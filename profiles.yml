# Repo-local dbt profile. dbt reads this file (from the current directory)
# before ~/.dbt/profiles.yml, so this repo never uses or changes the global one.
# DuckDB stores the whole database in one local file (git-ignored); it can be
# rebuilt anytime with `dbt seed` + `dbt run`.
dwh:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Defaults to dwh.duckdb in the current folder; the Airflow DAG sets a full path.
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dwh.duckdb') }}"
      threads: 4
